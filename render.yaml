databases:
  - name: st-solutions-db
    databaseName: st_solutions_production
    user: st_solutions_admin
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: st-solutions-api
    env: node
    rootDir: apps/api
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=./prisma/schema.prisma && npx prisma migrate deploy --schema=./prisma/schema.prisma && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: st-solutions-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@st-solutions.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SUB_ADMIN_EMAIL
        value: subadmin@st-solutions.com
      - key: SUB_ADMIN_PASSWORD
        generateValue: true
