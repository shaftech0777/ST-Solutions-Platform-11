services:
  - type: web
    name: st-solutions-api
    env: node
    rootDir: apps/api
    plan: free
    region: oregon
    buildCommand: bun install && bunx prisma generate && bun run build
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
